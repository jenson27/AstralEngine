<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Astral Engine Editor</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/src/editor/ui/editor.css" />
    <link rel="stylesheet" href="/src/editor/panels/diagnostics/diagnostics-panel.css" />
    <link rel="stylesheet" href="/src/editor/panels/scene-hierarchy-panel.css" />
    <link rel="stylesheet" href="/src/editor/panels/inspector/inspector-panel.css" />
    <link rel="stylesheet" href="/src/editor/panels/asset-browser/asset-browser-panel.css" />
  </head>
  <body>
    <main id="editor-shell">
      <header class="editor-toolbar">
        <strong>Astral Engine</strong>
        <span>Editor · Version 1</span>
        <div class="editor-document-controls" aria-label="Editor document">
          <output data-role="editor-document-status" aria-live="polite">
            Editor document · Loading
          </output>
          <button id="editor-export-scene" type="button" disabled>
            Export Scene JSON
          </button>
          <button id="editor-import-scene" type="button" disabled>
            Import Scene JSON
          </button>
          <input
            id="editor-import-scene-file"
            type="file"
            accept=".json,application/json"
            hidden
          />
        </div>
      </header>
      <div class="editor-workspace">
        <aside
          class="editor-dock editor-dock-left"
          data-editor-dock="left"
          aria-label="Left editor panels"
        ></aside>
        <div
          class="editor-resize-handle"
          data-editor-splitter="left"
          role="separator"
          aria-orientation="vertical"
          aria-label="Resize hierarchy panel"
          tabindex="0"
        ></div>
        <section
          id="editor-scene-viewport"
          class="editor-viewport"
          aria-label="Scene viewport"
        >
          <nav
            id="editor-scene-tabs"
            class="editor-scene-tabs"
            role="tablist"
            aria-label="Open scenes"
          ></nav>
          <canvas id="game-canvas" aria-label="Game view" tabindex="0"></canvas>
          <div class="editor-empty-scene" data-role="empty-scene" hidden>
            No scene is open. Double-click a scene in Asset Browser or import a scene.
          </div>
          <output id="engine-status" aria-live="polite">Starting...</output>
        </section>
      </div>
      <div
        class="editor-resize-handle"
        data-editor-splitter="right"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize Inspector panel"
        tabindex="0"
      ></div>
      <aside
        class="editor-dock editor-dock-right"
        data-editor-dock="right"
        aria-label="Right editor panels"
      >
        <nav
          class="editor-dock-tabs"
          data-editor-dock-tabs="right"
          role="tablist"
          aria-label="Right editor panels"
        ></nav>
      </aside>
      <div
        class="editor-bottom-resize-handle"
        data-editor-splitter="bottom"
        role="separator"
        aria-orientation="horizontal"
        aria-label="Resize bottom diagnostics panel"
        tabindex="0"
      ></div>
      <section class="editor-bottom-dock" aria-label="Editor tools">
        <nav
          class="editor-dock-tabs"
          data-editor-dock-tabs="bottom"
          role="tablist"
          aria-label="Editor tool panels"
        ></nav>
        <div
          class="editor-bottom-panel-host"
          data-editor-dock="bottom"
        ></div>
      </section>
    </main>
    <dialog
      id="editor-unsaved-close-dialog"
      class="editor-unsaved-close-dialog"
      aria-labelledby="editor-unsaved-close-title"
      aria-describedby="editor-unsaved-close-message"
    >
      <h2 id="editor-unsaved-close-title">Unsaved scene changes</h2>
      <p id="editor-unsaved-close-message"></p>
      <div class="editor-unsaved-close-actions">
        <button type="button" data-unsaved-action="export">Export Copy</button>
        <button type="button" data-unsaved-action="discard">Discard</button>
        <button type="button" data-unsaved-action="cancel">Cancel</button>
      </div>
    </dialog>
    <script type="module" src="/src/editor/main.js"></script>
  </body>
</html>
